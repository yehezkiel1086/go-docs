# https://taskfile.dev

version: '3'

dotenv:
  - .env

tasks:
  compose:up:
    desc: "run all docker compose services"
    cmd: docker compose up -d
  
  compose:down:
    desc: "stop all running docker compose services"
    cmd: docker compose down

  db:cli:
    desc: "open postgres cli"
    cmd: docker exec -it postgres psql -U {{ .DB_USER }} -d {{ .DB_NAME }}

  dev:user:http:
    desc: "run user service in development mode"
    cmd: go run ./services/user-service/cmd/http

  dev:product:http:
    desc: "run product service in development mode"
    cmd: go run ./services/product-service/cmd/http
  
  dev:product:rpc:
    desc: "run product service in development mode"
    cmd: go run ./services/product-service/cmd/rpc
  
  dev:inventory:rpc:
    desc: "run inventory service in development mode"
    cmd: go run ./services/inventory-service/cmd/rpc

  dev:order:http:
    desc: "run order service in development mode"
    cmd: go run ./services/order-service/cmd/http

  dev:notif:rabbitmq:
    desc: "run notification service rabbitmq consumer in development mode"
    cmd: go run ./services/notif-service/cmd/rabbitmq

  gen:inventory:
    desc: "generate inventory proto"
    cmd: protoc --go_out=./services/common/protobuf/inventory --go_opt=paths=source_relative --go-grpc_out=./services/common/protobuf/inventory --go-grpc_opt=paths=source_relative protobuf/inventory.proto

  gen:product:
    desc: "generate product proto"
    cmd: protoc --go_out=./services/common/protobuf/product --go_opt=paths=source_relative --go-grpc_out=./services/common/protobuf/product --go-grpc_opt=paths=source_relative protobuf/product.proto
