groups:
  - name: inventory
    rules:
      - alert: LowStockCritical
        expr: inventory_low_stock_alerts_total > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Multiple low stock alerts"

      - alert: SlowTransaction
        expr: histogram_quantile(0.95, rate(inventory_transaction_duration_seconds_bucket[5m])) > 1
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "p95 transaction latency exceeded 1s"